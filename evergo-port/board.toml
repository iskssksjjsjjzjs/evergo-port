# Redmi Note 11 5G / 11T 5G (evergo, MT6833, Dimensity 810)
# UniXNU 设备仓库骨架 —— 基于 tb365fc (MT6835) 改编，尚未真机验证
schema_version = 2

[board]
example = true
name = "evergo"
soc = "MT6833"
soc_source = "mt6833"
os_profile = "ipados-17.7.11-21H461"
description = "Redmi Note 11 5G / Note 11T 5G (Xiaomi evergo, MT6833)"
kit = "evergo"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "evergo_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/mt6833.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/evergo.dts"
include_dirs = ["soc:dts"]

[userdata]
# 真机实测（ON9LGAINJN4H558P，UFS 4096B 扇区，GPT 解析）
first_lba = 0x304000
last_lba = 0x3b94ff7
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[payload]
volume = "EVERGO"
size_mib = 192
loader = "firmware"
title = "UniXNU"
kernel_args = ["-v", "serial=3"]

[payload.adt]
chip_id = "0x6833"
unique_chip_id = "required"
root_match_volume_uuid = "REQUIRED_ROOT_VOLUME_UUID"
owned_memory_size = "0x10000000"
psci_method = "smc"
