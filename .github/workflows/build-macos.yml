name: Build XNU Kernel & Payload (macOS)

on:
  workflow_dispatch:
    inputs:
      unique_chip_id:
        description: '设备的 unique_chip_id（16 位十六进制）'
        required: true
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Clone UniXNU core (with submodules)
        run: |
          git clone --recurse-submodules https://github.com/UniXNU/UniXNU.git core

      - name: Fix upstream zzz-boot-progress.patch
        run: |
          python3 - <<'PY'
          import re
          p = "core/patches/xnu/zzz-boot-progress.patch"
          s = open(p, encoding="utf-8").read()
          s2 = re.sub(r'@@ -773,7 \+775,9 @@.*?(?=@@ |\Z)', '', s, flags=re.S)
          assert s2 != s, "hunk not found"
          open(p, "w", encoding="utf-8").write(s2)
          print("removed stale XNU_SHENG_PMGR hunk")
          PY

      - name: Verify Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Fetch sources
        run: |
          cd core
          ./unixnu fetch -D ../evergo-port

      - name: Select defconfig
        run: |
          cd core
          ./unixnu defconfig evergo_defconfig -D ../evergo-port

      - name: Build kernel (XNU)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd core
          set -o pipefail
          ./unixnu build kernel -D ../evergo-port 2>&1 | tee /tmp/kernel-build.log | tail -80

      - name: Show kernel build tail on failure
        if: failure()
        run: |
          echo "=== kernel-build.log tail ==="
          tail -120 /tmp/kernel-build.log 2>/dev/null || true
          echo "=== kernel-bootstrap.log (known path) ==="
          cat core/out/evergo/ipados-17.7.11-21H461/evergo/logs/kernel-bootstrap.log 2>/dev/null | tail -150 || true
          echo "=== any kernel-bootstrap.log ==="
          find core/out -name 'kernel-bootstrap.log' -exec tail -150 {} \; 2>/dev/null || true

      - name: Build userdata
        run: |
          cd core
          ./unixnu build userdata -D ../evergo-port

      - name: Build payload
        run: |
          cd core
          ./unixnu build payload -D ../evergo-port \
            --unique-chip-id "${{ github.event.inputs.unique_chip_id }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evergo-build-output
          path: |
            core/out/evergo/**/*.img
            core/out/evergo/**/*.json
            /tmp/kernel-build.log
          retention-days: 7
