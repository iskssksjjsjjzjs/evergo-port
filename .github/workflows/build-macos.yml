name: Build XNU Kernel & Payload (macOS)

on:
  workflow_dispatch:
    inputs:
      unique_chip_id:
        description: '设备的 unique_chip_id（16 位十六进制）'
        required: true
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Clone UniXNU core (with submodules)
        run: |
          git clone --recurse-submodules https://github.com/UniXNU/UniXNU.git core

      - name: Fix upstream zzz-boot-progress.patch
        run: |
          python3 - <<'PY'
          import re
          p = "core/patches/xnu/zzz-boot-progress.patch"
          s = open(p, encoding="utf-8").read()
          s2 = re.sub(r'@@ -773,7 \+775,9 @@.*?(?=@@ |\Z)', '', s, flags=re.S)
          assert s2 != s, "hunk not found"
          open(p, "w", encoding="utf-8").write(s2)
          print("removed stale XNU_SHENG_PMGR hunk")

          # build-arm-driver.py 硬编码的 -Wno-unnecessary-virtual-specifier 在新 clang 已移除
          p3 = "core/scripts/build-arm-driver.py"
          s3 = open(p3, encoding="utf-8").read()
          assert "'-Wno-unnecessary-virtual-specifier', " in s3, "flag not found"
          s3 = s3.replace("'-Wno-unnecessary-virtual-specifier', ", "")
          open(p3, "w", encoding="utf-8").write(s3)
          print("removed -Wno-unnecessary-virtual-specifier from build-arm-driver.py")
          PY

      - name: Verify Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Fetch sources
        run: |
          cd core
          ./unixnu fetch -D ../evergo-port

      - name: Select defconfig
        run: |
          cd core
          ./unixnu defconfig evergo_defconfig -D ../evergo-port

      - name: Build kernel (XNU)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          XNU_EXTRA_CFLAGS: "-Wno-reserved-identifier -Wno-pre-c11-compat -Wno-missing-designated-field-initializers -Wno-suggest-override -Wno-suggest-destructor-override -Wno-ms-bitfield-padding"
        run: |
          cd core
          set -o pipefail
          ./unixnu build kernel -D ../evergo-port 2>&1 | tee /tmp/kernel-build.log | tail -50

      - name: Show kernel build tail on failure
        if: failure()
        run: |
          echo "=== grep LDFILELIST context ==="
          find core/out -name 'kernel-bootstrap.log' -exec sh -c 'grep -n -A40 -B5 "LDFILELIST bsd" "{}" | tail -60' \; 2>/dev/null || true
          echo "=== grep real errors ==="
          find core/out -name 'kernel-bootstrap.log' -exec sh -c 'grep -n -iE "^.*error:|\*\*\*|undefined symbol|ld: |No such file|cannot find" "{}" | tail -30' \; 2>/dev/null || true

      - name: Build userdata
        run: |
          cd core
          ./unixnu build userdata -D ../evergo-port

      - name: Build payload
        run: |
          cd core
          ./unixnu build payload -D ../evergo-port \
            --unique-chip-id "${{ github.event.inputs.unique_chip_id }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evergo-build-output
          path: |
            core/out/evergo/**/*.img
            core/out/evergo/**/*.json
            /tmp/kernel-build.log
          retention-days: 7
